MatchingTranslations:
  enabled: false
TemplateLength:
  enabled: false
# Stock Eurus uses dynamic HTML tags and concatenated translation keys.
# Theme Check reports those as errors even though the Liquid is valid at runtime.
LiquidHTMLSyntaxError:
  enabled: false
ImgWidthAndHeight:
  enabled: false
TranslationKeyExists:
  enabled: false
# Locale schema files ship with structures this checker's JSON schema rejects.
ValidJSON:
  enabled: false
